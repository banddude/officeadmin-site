<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>officeadmin · system explorer v2</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #0d0e10;
      --bg-elev: #16181c;
      --fg: #e4e6eb;
      --fg-dim: #8b8f96;
      --accent: #4a9eff;
      --border: #2a2d33;
      --node-subsystem: #4a9eff;
      --node-module: #7c5cff;
      --node-file: #d9d9d9;
      --node-function: #6b7280;
      --node-class: #f59e0b;
      --node-launchd: #10b981;
      --node-skill: #ec4899;
      --node-mcp: #06b6d4;
      --node-machine: #ef4444;
      --edge-contained: #3a3d44;
      --edge-imports: #4a9eff;
      --edge-schedules: #10b981;
      --edge-implements: #ec4899;
      --edge-calls: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-elev); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
    header h1 .dim { color: var(--fg-dim); font-weight: 400; }
    .breadcrumb { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--fg-dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .breadcrumb a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .breadcrumb .sep { color: var(--border); }
    #search { background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 12px; width: 200px; }
    #search:focus { outline: none; border-color: var(--accent); }
    button.reset { background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    button.reset:hover { border-color: var(--accent); }
    main { position: relative; overflow: hidden; }
    #cy { width: 100%; height: 100%; }
    #legend { position: absolute; bottom: 12px; left: 12px; background: rgba(22, 24, 28, 0.95); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 11px; max-width: 240px; z-index: 10; }
    #legend h2 { font-size: 11px; margin: 0 0 8px 0; color: var(--fg-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--fg); }
    #legend .swatch { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    #legend .edge-swatch { width: 16px; height: 2px; flex-shrink: 0; }
    #info { position: absolute; top: 12px; right: 12px; background: rgba(22, 24, 28, 0.95); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 12px; max-width: 280px; z-index: 10; display: none; }
    #info.visible { display: block; }
    #info h3 { margin: 0 0 6px 0; font-size: 13px; color: var(--fg); }
    #info .meta { color: var(--fg-dim); font-size: 11px; margin-bottom: 8px; }
    #info .neighbors { font-size: 11px; color: var(--fg-dim); }
    #stats { position: absolute; top: 12px; left: 12px; font-size: 11px; color: var(--fg-dim); background: rgba(22, 24, 28, 0.95); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); z-index: 10; }
    @media (max-width: 600px) {
      header { gap: 8px; padding: 8px 12px; }
      header h1 { font-size: 12px; }
      #search { width: 100%; }
      #legend { font-size: 10px; max-width: 200px; }
      #info { max-width: calc(100vw - 24px); }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>officeadmin <span class="dim">/ explorer v2</span></h1>
      <div class="breadcrumb" id="breadcrumb">
        <a data-focus="">all subsystems</a>
      </div>
      <input id="search" type="search" placeholder="search nodes..." autocomplete="off">
      <button class="reset" id="resetBtn">reset view</button>
      <a href="./tree.html" style="color: var(--accent); font-size: 12px; text-decoration: none;">accessible view</a>
    </header>
    <main>
      <div id="cy"></div>
      <div id="stats">loading…</div>
      <div id="legend">
        <h2>nodes</h2>
        <div class="row"><span class="swatch" style="background: var(--node-subsystem)"></span> subsystem</div>
        <div class="row"><span class="swatch" style="background: var(--node-machine)"></span> machine</div>
        <div class="row"><span class="swatch" style="background: var(--node-module)"></span> module</div>
        <div class="row"><span class="swatch" style="background: var(--node-file)"></span> file</div>
        <div class="row"><span class="swatch" style="background: var(--node-class)"></span> class</div>
        <div class="row"><span class="swatch" style="background: var(--node-function)"></span> function</div>
        <div class="row"><span class="swatch" style="background: var(--node-launchd)"></span> launchd job</div>
        <div class="row"><span class="swatch" style="background: var(--node-skill)"></span> skill</div>
        <div class="row"><span class="swatch" style="background: var(--node-mcp)"></span> mcp tool</div>
        <h2 style="margin-top: 10px">edges</h2>
        <div class="row"><span class="edge-swatch" style="background: var(--edge-contained)"></span> contained in</div>
        <div class="row"><span class="edge-swatch" style="background: var(--edge-imports)"></span> imports</div>
        <div class="row"><span class="edge-swatch" style="background: var(--edge-schedules)"></span> schedules</div>
        <div class="row"><span class="edge-swatch" style="background: var(--edge-implements)"></span> implements</div>
        <div class="row"><span class="edge-swatch" style="background: var(--edge-calls)"></span> calls</div>
      </div>
      <div id="info"></div>
    </main>
  </div>

  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  <script src="./explorer.js?v=2026-05-12-v4" type="module"></script>
</body>
</html>
